name: Crate OS DJ Edition macOS builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**"
      - ".github/workflows/crate-os-dj-edition.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: apple-silicon
          - runner: macos-15-intel
            artifact: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:dj-mixes
      - run: npm run dj-mixes:build
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri:build:app
      - uses: actions/upload-artifact@v4
        with:
          name: crate-os-dj-edition-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
      # A zip made with ditto keeps the app runnable (a plain artifact copy loses its permissions)
      - name: Zip the app for the download page
        run: |
          V=$(node -p "require('./package.json').version")
          ARCH=$([ "${{ matrix.artifact }}" = "intel" ] && echo x86_64 || echo arm64)
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)" \
            "release/Crate-OS-DJ-Edition-$V-macOS-$ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: crate-os-download-${{ matrix.artifact }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    # Posts the Apple Silicon and Intel zips as a pre-release. Only when started by hand or by a version tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crate-os-download-*
          merge-multiple: true
          path: release
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          cd release && sha256sum *.zip > SHA256SUMS.txt && cd ..
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "v$V" release/*.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" \
              --title "Crate OS DJ Edition $V" --notes-file notes.md --prerelease
          fi
